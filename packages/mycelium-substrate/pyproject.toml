[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mycelium-substrate"
version = "0.1.0"
description = "Mycelium stigmergic trace substrate — durable trace log, offline pattern miners, MCP server, Nostr/Gitea/Vantage publishing. Runs on any device: VPS, desktop, or Termux phone."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
nostr = ["secp256k1>=0.14; platform_system != 'Windows'"]

[project.scripts]
mycelium = "mycelium_substrate.cli:main"
mycelium-mcp = "mycelium_substrate.mcp_server:serve"
mycelium-http = "mycelium_substrate.http_server:serve"

[tool.setuptools.packages.find]
include = ["mycelium_substrate*"]
